name: Update lemma

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable Lemma release tag. Leave empty for the latest release.
        required: false
        type: string
  repository_dispatch:
    types: [lemma-release]

permissions:
  contents: write

concurrency:
  group: update-lemma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            # An empty list is normal until Lemma's first stable release.
            tag="$(gh api repos/phongndo/lemma/releases --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')"
          fi
          if [[ -z "$tag" ]]; then
            echo 'No stable Lemma release yet.'
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download generated formula
        if: steps.release.outputs.tag != ''
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          gh release download "$RELEASE_TAG" --repo phongndo/lemma --pattern lemma.rb --dir "$temporary"
          candidate="$temporary/lemma.rb"
          ruby -c "$candidate"
          grep -Fq 'class Lemma < Formula' "$candidate"
          grep -Fq "https://github.com/phongndo/lemma/releases/download/$RELEASE_TAG/" "$candidate"
          if cmp -s "$candidate" Formula/lemma.rb; then exit 0; fi
          install -m 644 "$candidate" Formula/lemma.rb
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Commit formula
        if: steps.formula.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/lemma.rb
          git commit -m "lemma $RELEASE_TAG"
          git push
