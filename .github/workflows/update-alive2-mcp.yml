name: Update alive2-mcp

on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable alive2-mcp release tag. Leave empty for the latest release.
        required: false
        type: string
  repository_dispatch:
    types: [alive2-mcp-release]

permissions:
  contents: write

concurrency:
  group: update-alive2-mcp
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/phongndo/alive2-mcp/releases --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')"
          fi
          if [[ -z "$tag" ]]; then
            echo 'No stable alive2-mcp release yet.'
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Releases from before the formula was generated have none to publish.
          if ! gh release view "$tag" --repo phongndo/alive2-mcp --json assets --jq '.assets[].name' | grep -Fxq alive2-mcp.rb; then
            echo "alive2-mcp $tag has no alive2-mcp.rb."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download generated formula
        if: steps.release.outputs.tag != ''
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          gh release download "$RELEASE_TAG" --repo phongndo/alive2-mcp --pattern alive2-mcp.rb --dir "$temporary"
          candidate="$temporary/alive2-mcp.rb"
          ruby -c "$candidate"
          grep -Fq 'class Alive2Mcp < Formula' "$candidate"
          grep -Fq "https://github.com/phongndo/alive2-mcp/releases/download/$RELEASE_TAG/" "$candidate"
          if cmp -s "$candidate" Formula/alive2-mcp.rb; then exit 0; fi
          install -m 644 "$candidate" Formula/alive2-mcp.rb
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit formula
        if: steps.formula.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/alive2-mcp.rb
          git commit -m "alive2-mcp $RELEASE_TAG"
          # The other updaters push to main too; each changes only its own formula.
          for _ in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
