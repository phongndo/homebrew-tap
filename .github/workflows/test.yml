name: Test formulas

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mark-cli:
    name: mark-cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Add local tap
        run: brew tap phongndo/tap "$GITHUB_WORKSPACE"

      - name: Check formula style
        run: brew style phongndo/tap

      - name: Install and test mark-cli
        run: |
          brew install phongndo/tap/mark-cli
          "$(brew --prefix)/bin/mark" --version
          brew test phongndo/tap/mark-cli
