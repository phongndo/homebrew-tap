name: Update frame

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable Frame release tag. Leave empty for the latest release.
        required: false
        type: string
  repository_dispatch:
    types: [frame-release]

permissions:
  contents: write

concurrency:
  group: update-frame
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/phongndo/frame/releases --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')"
          fi
          if [[ -z "$tag" ]]; then
            echo 'No stable Frame release yet.'
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download generated formula
        if: steps.release.outputs.tag != ''
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          gh release download "$RELEASE_TAG" --repo phongndo/frame --pattern frame.rb --dir "$temporary"
          candidate="$temporary/frame.rb"
          ruby -c "$candidate"
          grep -Fq 'class Frame < Formula' "$candidate"
          grep -Fq "https://github.com/phongndo/frame/releases/download/$RELEASE_TAG/" "$candidate"
          if cmp -s "$candidate" Formula/frame.rb; then exit 0; fi
          install -m 644 "$candidate" Formula/frame.rb
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit formula
        if: steps.formula.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/frame.rb
          git commit -m "frame $RELEASE_TAG"
          git push
