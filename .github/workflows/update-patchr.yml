name: Update patchr

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish. Leave empty for the latest stable release.
        required: false
        type: string
  repository_dispatch:
    types:
      - patch-release

permissions:
  contents: write
  actions: write # to start Test formulas after a push

concurrency:
  group: update-patchr
  cancel-in-progress: false

jobs:
  update:
    name: Update formula
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
          UPSTREAM_REPOSITORY: phongndo/patch
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$REQUESTED_TAG"
          if [[ -z "$release_tag" ]]; then
            # Until the first release there is nothing to do.
            release_tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)" || exit 0
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid patch release tag: $release_tag" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download generated formula
        if: steps.release.outputs.release_tag != ''
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          UPSTREAM_REPOSITORY: phongndo/patch
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf "$temporary_directory"' EXIT

          gh release download "$RELEASE_TAG" \
            --repo "$UPSTREAM_REPOSITORY" \
            --pattern patchr.rb \
            --dir "$temporary_directory"

          candidate="$temporary_directory/patchr.rb"
          ruby -c "$candidate"
          grep -Fq "class Patchr < Formula" "$candidate"
          grep -Fq "releases/download/$RELEASE_TAG/" "$candidate"

          if cmp -s "$candidate" Formula/patchr.rb; then
            echo "patchr is already at $RELEASE_TAG"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          install -m 644 "$candidate" Formula/patchr.rb
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit formula
        if: steps.formula.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/patchr.rb
          git commit -m "patchr $RELEASE_TAG"
          # The other updaters push to main too; each changes only its own formula.
          for _ in 1 2 3; do
            # Pushes with GITHUB_TOKEN start no workflows; a dispatch is the exception.
            git pull --rebase --quiet && git push && { gh workflow run test.yml --ref main || echo "::warning::could not start Test formulas"; exit 0; }
            sleep 5
          done
          exit 1
